<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Erudoza desktop learning workspace</title>
  <desc id="desc">A browser-based Erudoza interface showing a focused learning path, review prompt, and evidence progress.</desc>
  <rect width="1440" height="980" rx="16" fill="#071127"/><rect x="64" y="54" width="1312" height="872" rx="14" fill="#FAFAF7"/><path d="M64 120h1312" stroke="#DCE2E9"/><circle cx="104" cy="87" r="8" fill="#FF8A65"/><circle cx="130" cy="87" r="8" fill="#14B8A6"/><circle cx="156" cy="87" r="8" fill="#4DA6FF"/><rect x="208" y="72" width="750" height="30" rx="7" fill="#EEF2F5"/><rect x="98" y="154" width="246" height="738" rx="11" fill="#FFFFFF" stroke="#DCE2E9"/><image href="data:image/svg+xml;base64," x="122" y="178" width="58" height="58" preserveAspectRatio="xMidYMid meet"/><text x="196" y="214" text-anchor="start" fill="#0D1B3D" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-1">Erudoza</text><g fill="#43506B" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600"><text x="126" y="300">Today</text><text x="126" y="354">Explore</text><text x="126" y="408">Review</text><text x="126" y="462">Progress</text></g><rect x="384" y="154" width="958" height="738" rx="11" fill="#FFFFFF"/><text x="430" y="224" fill="#43506B" font-family="Inter,Arial,sans-serif" font-size="18">Focused session · about 18 min</text><text x="430" y="286" fill="#0D1B3D" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" letter-spacing="-1">Make the idea usable.</text><text x="430" y="330" fill="#43506B" font-family="Inter,Arial,sans-serif" font-size="20">Explain it, practice it, then apply it to a real decision.</text><rect x="430" y="382" width="566" height="220" rx="12" fill="#0D1B3D"/><text x="468" y="430" fill="#C5CEDE" font-family="Inter,Arial,sans-serif" font-size="16">TODAY'S NEXT STEP</text><text x="468" y="478" fill="#FAFAF7" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">Test the concept from memory</text><text x="468" y="520" fill="#C5CEDE" font-family="Inter,Arial,sans-serif" font-size="18">One retrieval prompt, then one transfer task.</text><rect x="468" y="552" width="176" height="42" rx="7" fill="#FAFAF7"/><text x="556" y="579" text-anchor="middle" fill="#0D1B3D" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Start practice</text><text x="430" y="672" fill="#0D1B3D" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Evidence of understanding</text><path d="M430 734h796" stroke="#DCE2E9" stroke-width="12" stroke-linecap="round"/><path d="M430 734h532" stroke="#14B8A6" stroke-width="12" stroke-linecap="round"/><g fill="#43506B" font-family="Inter,Arial,sans-serif" font-size="16"><text x="430" y="786">Recall</text><text x="700" y="786">Guided practice</text><text x="1000" y="786">Transfer</text></g>
</svg>
