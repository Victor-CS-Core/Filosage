name: Record Azure PostgreSQL recovery window

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-postgres-backup-evidence
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: azure-staging
    env:
      EXPECTED_POSTGRES_RESOURCE_ID: ${{ vars.AZURE_POSTGRES_RESOURCE_ID }}
      APPROVED_BACKUP_RETENTION_DAYS: ${{ vars.AZURE_POSTGRES_APPROVED_RETENTION_DAYS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate approved observation inputs before Azure login
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-backup-observation.mjs check-inputs

      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Record managed backup recovery-window observation
        shell: bash
        run: |
          set -euo pipefail
          az postgres flexible-server show \
            --ids "$EXPECTED_POSTGRES_RESOURCE_ID" \
            --query '{id:id,state:state,earliestRestoreDate:backup.earliestRestoreDate,retentionDays:backup.backupRetentionDays}' \
            --output json > "${RUNNER_TEMP}/azure-postgres-backup-response.json"
          node scripts/validate-backup-observation.mjs observe \
            < "${RUNNER_TEMP}/azure-postgres-backup-response.json" \
            > "${RUNNER_TEMP}/azure-postgres-backup-evidence.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azure-postgres-recovery-window-observation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azure-postgres-backup-evidence.json
          retention-days: 90
          if-no-files-found: error
