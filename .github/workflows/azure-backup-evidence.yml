name: Verify Azure PostgreSQL backups

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-postgres-backup-evidence
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production-operations
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Record managed backup recovery window
        shell: bash
        run: |
          set -euo pipefail
          az postgres flexible-server show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_POSTGRES_SERVER_NAME }}" \
            --query '{server:name,state:state,earliestRestoreDate:backup.earliestRestoreDate,retentionDays:backup.backupRetentionDays,checkedAt:null}' \
            --output json > "${RUNNER_TEMP}/azure-postgres-backup-evidence.json"
          node -e 'const fs=require("fs"); const p=process.env.RUNNER_TEMP+"/azure-postgres-backup-evidence.json"; const v=JSON.parse(fs.readFileSync(p)); v.checkedAt=new Date().toISOString(); if(v.state!=="Ready"||!v.earliestRestoreDate) process.exit(1); fs.writeFileSync(p, JSON.stringify(v,null,2)+"\n")'

      - uses: actions/upload-artifact@v4
        with:
          name: azure-postgres-backup-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azure-postgres-backup-evidence.json
          retention-days: 90
