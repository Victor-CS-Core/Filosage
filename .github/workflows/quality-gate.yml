name: Engineering quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-release-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source SHA
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          mkdir -p test-results/release
          printf '%s\n' "$actual_sha" > test-results/release/source-sha.txt
          test "$actual_sha" = "$EXPECTED_RELEASE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Classify the complete PR diff
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-scope.mjs
      - name: Verify CI scope and release evidence safeguards
        run: node --test tests/ci/*.test.mjs tests/workflow-quality-evidence.test.mjs
      - name: Verify alert receiver and maintenance access contracts
        run: node --test tests/maintenance-access/*.test.mjs tests/recovery/alert-receiver.test.mjs
      - run: npm ci
        if: steps.scope.outputs.full == 'true'
      - run: npm run lint
        if: steps.scope.outputs.full == 'true'
      - run: npm run test:eval-harness
        if: steps.scope.outputs.full == 'true'
      - run: npm run test:evaluation-budget
        if: steps.scope.outputs.full == 'true'
      - run: npm run test:lesson-integrity
        if: steps.scope.outputs.full == 'true'
      - run: npm run test:lesson-operations
        if: steps.scope.outputs.full == 'true'
      - run: npm run test:billing
        if: steps.scope.outputs.full == 'true'
      - run: npx tsc --noEmit --incremental false
        if: steps.scope.outputs.full == 'true'
      - run: npm audit --omit=dev --audit-level=high
        if: steps.scope.outputs.full == 'true'
      - run: npm audit --audit-level=high
        if: steps.scope.outputs.full == 'true'
      - run: npm run check:secrets
      - run: npm run check:support-wiki
      - name: Install pinned Bicep compiler
        if: steps.scope.outputs.full == 'true'
        run: az bicep install --version v0.46.1
      - name: Compile isolated alert receiver deployment
        if: steps.scope.outputs.full == 'true'
        run: az bicep build --file infra/azure/operations-alert-receiver.bicep --outfile "$RUNNER_TEMP/operations-alert-receiver.json"
      - run: npm run test:contracts -- --output=test-results/contracts --reporter=line,blob
        if: steps.scope.outputs.full == 'true'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: playwright-report/contracts/blob
      - run: npm run build
        if: steps.scope.outputs.full == 'true'
      - name: Upload contract evidence
        if: always() && steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-contract-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  browser-smoke:
    needs: static-and-release-contracts
    if: needs.static-and-release-contracts.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify release source SHA
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          mkdir -p test-results/release
          printf '%s\n' "$actual_sha" > test-results/release/source-sha.txt
          test "$actual_sha" = "$EXPECTED_RELEASE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        id: dependencies
      - run: npx playwright install --with-deps --only-shell chromium
        id: browsers
      - name: API regression
        id: api
        run: npm run test:api -- --output=test-results/api --reporter=line,blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: playwright-report/api/blob
      - name: Chromium smoke regression
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:browser:smoke
      - name: Merge all completed lane reports
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/complete
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/complete/results.json
        run: |
          mkdir -p playwright-report/all-blobs
          index=0
          while IFS= read -r -d '' report; do
            cp "$report" "playwright-report/all-blobs/report-${index}.zip"
            index=$((index + 1))
          done < <(find playwright-report -type f -path '*/blob/*.zip' -print0)
          test "$index" -gt 0
          npx --no-install playwright merge-reports --reporter=html,json playwright-report/all-blobs
      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  postgres-transactions:
    needs: static-and-release-contracts
    if: needs.static-and-release-contracts.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: filosage_test
          POSTGRES_PASSWORD: testfixture-ci-only
          POSTGRES_DB: filosage_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filosage_test -d filosage_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Ephemeral CI service credentials; never a repository or production secret.
      FILOSAGE_POSTGRES_TEST_URL: postgresql://filosage_test:testfixture-ci-only@127.0.0.1:5432/filosage_integration_test # secret-scan: allow-test-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify release source SHA
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          mkdir -p test-results/postgres
          printf '%s\n' "$actual_sha" > test-results/postgres/source-sha.txt
          test "$actual_sha" = "$EXPECTED_RELEASE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify real PostgreSQL transaction behavior
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/postgres
          npm run test:postgres 2>&1 | tee test-results/postgres/results.tap
      - name: Verify signed billing lifecycle against PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          npm run test:billing 2>&1 | tee test-results/postgres/billing-results.tap
      - name: Upload PostgreSQL transaction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-transaction-evidence
          path: test-results/postgres/
          if-no-files-found: error
          retention-days: 14
