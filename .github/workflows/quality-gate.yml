name: Engineering quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-release-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm audit --audit-level=high
      - run: npm run check:support-wiki
      - run: FILOSAGE_PLAYWRIGHT_PROJECT=chromium PLAYWRIGHT_PORT=4400 npx playwright test --project=chromium tests/azure-infrastructure.spec.ts tests/release-scripts.spec.ts tests/release-hardening.spec.ts --reporter=line
      - run: npm run build

  command-center-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:command-center:v2
      - run: npm run test:command-center:v2:ui
      - run: npm run test:shared-evidence:ui
      - name: Upload Command Center diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-center-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  browser-regression:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Upload browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14