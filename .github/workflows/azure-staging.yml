name: Stage QA-approved image for production

on:
  workflow_dispatch:
    inputs:
      qa_run_id:
        description: Successful isolated QA run containing the approved SHA, image digest, and capability manifest
        required: true
        type: string
      target_slot:
        description: Inactive production label to receive the QA-approved image
        required: true
        default: green
        type: choice
        options:
          - green
          - blue
      expected_auth_mode:
        description: Authentication mode already approved and configured on the production Container App
        required: true
        default: migration-dual
        type: choice
        options:
          - migration-dual
          - direct-google
      external_id_new_accounts_enabled:
        description: Keep External ID registration available on the staged revision
        required: true
        default: true
        type: boolean
      expected_sha:
        description: Full Git SHA already deployed and verified in isolated QA
        required: true
        type: string
      featured_course_id:
        description: Exact public landing-page course ID, or the explicit value none
        required: true
        default: none
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: azure-staging
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    environment: azure-staging
    env:
      TARGET_SLOT: ${{ inputs.target_slot }}
      QA_RUN_ID: ${{ inputs.qa_run_id }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      FEATURED_COURSE_ID: ${{ inputs.featured_course_id }}
      TARGET_URL: ${{ inputs.target_slot == 'blue' && vars.AZURE_BLUE_URL || vars.AZURE_GREEN_URL }}
      QA_URL: ${{ vars.AZURE_QA_URL }}
      PUBLIC_SITE_URL: https://filosage.com
      EXPECTED_AUTH_MODE: ${{ inputs.expected_auth_mode }}
      EXTERNAL_ID_RUNTIME_ENABLED: ${{ inputs.expected_auth_mode == 'migration-dual' && 'true' || 'false' }}
      EXTERNAL_ID_NEW_ACCOUNTS: ${{ inputs.external_id_new_accounts_enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate reviewed authentication inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_AUTH_MODE" == "direct-google" && "$EXTERNAL_ID_NEW_ACCOUNTS" == "true" ]]; then
            echo "New External ID accounts require migration-dual authentication mode."
            exit 1
          fi

      - name: Verify the exact SHA passed full browser regression
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/full-regression.yml/runs" \
            -f "head_sha=${EXPECTED_SHA}" \
            -f "status=success" \
            -f "per_page=1")"
          printf '%s' "$EVIDENCE" \
            | node scripts/check-workflow-run-evidence.mjs \
              "$EXPECTED_SHA" \
              ".github/workflows/full-regression.yml"
      - name: Load the exact successful QA candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$QA_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ || "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "Select a numeric QA run and execute from its exact full candidate SHA."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QA_RUN_ID}" --jq '{workflow_runs:[.]}' \
            | node scripts/check-workflow-run-evidence.mjs "$EXPECTED_SHA" ".github/workflows/azure-qa.yml"
          gh run download "$QA_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-candidate-${EXPECTED_SHA}" --dir "$RUNNER_TEMP/qa-candidate"
          node scripts/release-capabilities.mjs verify-evidence "$RUNNER_TEMP/qa-candidate/release-candidate.json" "$EXPECTED_SHA" "$PUBLIC_SITE_URL" >> "$GITHUB_ENV"
          node scripts/release-capabilities.mjs environment > "$RUNNER_TEMP/release-capabilities.env"

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify inactive production authentication state before staging
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER_STATE="$(az containerapp auth show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query '{google:identityProviders.google.enabled || `false`,filosage:identityProviders.customOpenIdConnectProviders.filosage.enabled || `false`}' \
            --output json)"
          {
            echo "### Production authentication provider state before staging"
            echo '```json'
            echo "$PROVIDER_STATE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$PROVIDER_STATE" \
            | node scripts/check-auth-provider-state.mjs "$EXPECTED_AUTH_MODE"

      - name: Verify the exact SHA in isolated QA
        env:
          EXPECTED_AUTH_MODE: ${{ env.QA_AUTH_MODE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "expected_sha must be a full 40-character Git SHA."
            exit 1
          fi
          if [[ "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "Run this workflow from the exact branch or commit selected in QA."
            exit 1
          fi
          if [[ "$FEATURED_COURSE_ID" != "none" && ! "$FEATURED_COURSE_ID" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "featured_course_id must be none or a 64-character hexadecimal course ID."
            exit 1
          fi
          if [[ "$QA_URL" != "$QA_EVIDENCE_ORIGIN" ]]; then
            echo "The QA origin does not match the approved candidate evidence."
            exit 1
          fi
          OBSERVED_IMAGE="$(az containerapp show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_QA_CONTAINER_APP_NAME }}" --query 'properties.template.containers[0].image' --output tsv)"
          node scripts/release-capabilities.mjs check-image "${{ vars.AZURE_ACR_NAME }}.azurecr.io/filosage" "$EXPECTED_IMAGE_DIGEST" "$OBSERVED_IMAGE"
          npm run check:production -- "$QA_URL" "$EXPECTED_SHA" "$QA_URL"

      - name: Deploy the exact image to Azure Container Apps
        id: deploy_revision
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ vars.AZURE_ACR_NAME }}.azurecr.io/filosage@${EXPECTED_IMAGE_DIGEST}"
          mapfile -t CAPABILITY_ENV < "$RUNNER_TEMP/release-capabilities.env"
          REMOVE_ENV_VARS=(
            "NEXT_PUBLIC_ENTRA_CLIENT_ID"
            "NEXT_PUBLIC_ENTRA_AUTHORITY"
            "NEXT_PUBLIC_ENTRA_TENANT_ID"
            "NEXT_PUBLIC_ENTRA_API_SCOPE"
            "NEXT_PUBLIC_ENTRA_REDIRECT_URI"
            "ENTRA_AUDIENCE"
            "ENTRA_ISSUER"
            "ENTRA_JWKS_URI"
            "ENTRA_DIRECTORY_TENANT_ID"
            "ENTRA_DIRECTORY_CLIENT_ID"
            "ENTRA_DIRECTORY_CLIENT_SECRET"
          )
          SET_ENV_VARS=(
            "${CAPABILITY_ENV[@]}"
            "RELEASE_IMAGE_DIGEST=${EXPECTED_IMAGE_DIGEST}"
            "SITE_VERSION=${EXPECTED_SHA}"
            "NEXT_PUBLIC_SITE_URL=${PUBLIC_SITE_URL}"
            "DEPLOYMENT_ENVIRONMENT=production"
            "OPERATIONS_ENVIRONMENT=production"
            "AZURE_EASY_AUTH_ENABLED=true"
            "DIRECT_GOOGLE_AUTH_ENABLED=true"
            "EXTERNAL_ID_AUTH_ENABLED=${EXTERNAL_ID_RUNTIME_ENABLED}"
            "EXTERNAL_ID_NEW_ACCOUNTS_ENABLED=${EXTERNAL_ID_NEW_ACCOUNTS}"
            "BILLING_ENABLED=false"
            "BILLING_ROLLOUT_MODE=closed"
            "STRIPE_TAX_READY=false"
            "DEPLOYMENT_SLOT=${TARGET_SLOT}"
          )
          if [[ "$FEATURED_COURSE_ID" == "none" ]]; then
            REMOVE_ENV_VARS+=("LANDING_FEATURED_COURSE_ID")
          else
            SET_ENV_VARS+=("LANDING_FEATURED_COURSE_ID=${FEATURED_COURSE_ID}")
          fi
          ACTIVE_WEIGHT="$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query "properties.configuration.ingress.traffic[?label=='${TARGET_SLOT}'].weight | [0]" \
            --output tsv)"
          if [[ "${ACTIVE_WEIGHT:-0}" != "0" ]]; then
            echo "Refusing to replace ${TARGET_SLOT}; it currently carries ${ACTIVE_WEIGHT}% traffic."
            exit 1
          fi
          az containerapp revision set-mode \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --mode multiple
          REVISION_SUFFIX="${TARGET_SLOT}-${EXPECTED_SHA:0:8}-${GITHUB_RUN_ATTEMPT}"
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --image "$IMAGE" \
            --revision-suffix "$REVISION_SUFFIX" \
            --remove-env-vars "${REMOVE_ENV_VARS[@]}" \
            --set-env-vars "${SET_ENV_VARS[@]}"
          REVISION="$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query properties.latestRevisionName \
            --output tsv)"
          REVISION_FQDN="$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query properties.latestRevisionFqdn \
            --output tsv)"
          if [[ -z "$REVISION" || ! "$REVISION_FQDN" =~ ^[a-z0-9.-]+\.azurecontainerapps\.io$ ]]; then
            echo "The deployed revision name or HTTPS hostname could not be resolved."
            exit 1
          fi
          OBSERVED_IMAGE="$(az containerapp revision show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --revision "$REVISION" --query 'properties.template.containers[0].image' --output tsv)"
          node scripts/release-capabilities.mjs check-image "${{ vars.AZURE_ACR_NAME }}.azurecr.io/filosage" "$EXPECTED_IMAGE_DIGEST" "$OBSERVED_IMAGE"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "revision_url=https://${REVISION_FQDN}" >> "$GITHUB_OUTPUT"

      - name: Verify inactive production authentication state after staging
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER_STATE="$(az containerapp auth show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query '{google:identityProviders.google.enabled || `false`,filosage:identityProviders.customOpenIdConnectProviders.filosage.enabled || `false`}' \
            --output json)"
          {
            echo "### Production authentication provider state after staging"
            echo '```json'
            echo "$PROVIDER_STATE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$PROVIDER_STATE" \
            | node scripts/check-auth-provider-state.mjs "$EXPECTED_AUTH_MODE"

      - name: Verify the deployed release safety policy
        shell: bash
        run: |
          set -euo pipefail
          npm run check:production -- "${{ steps.deploy_revision.outputs.revision_url }}" "$EXPECTED_SHA" "$PUBLIC_SITE_URL"
          npm run check:release-safety -- "${{ steps.deploy_revision.outputs.revision_url }}"
          npm run check:featured-course -- "${{ steps.deploy_revision.outputs.revision_url }}" "$FEATURED_COURSE_ID"

      - name: Assign verified revision label
        shell: bash
        run: |
          set -euo pipefail
          az containerapp revision label add \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --label "$TARGET_SLOT" \
            --revision "${{ steps.deploy_revision.outputs.revision }}" \
            --yes

      - name: Verify the labeled QA candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run check:production -- "${TARGET_URL}" "${EXPECTED_SHA}" "${PUBLIC_SITE_URL}"
          npm run check:featured-course -- "${TARGET_URL}" "$FEATURED_COURSE_ID"
