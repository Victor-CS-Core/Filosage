name: Deploy Azure staging

on:
  workflow_dispatch:
    inputs:
      target_slot:
        description: Inactive revision label to receive the QA candidate
        required: true
        default: green
        type: choice
        options:
          - green
          - blue
      public_site_url:
        description: Canonical HTTPS origin compiled into the candidate; defaults to the selected slot URL
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-staging
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    environment: azure-staging
    env:
      TARGET_SLOT: ${{ inputs.target_slot }}
      TARGET_URL: ${{ inputs.target_slot == 'blue' && vars.AZURE_BLUE_URL || vars.AZURE_GREEN_URL }}
      PUBLIC_SITE_URL: ${{ inputs.public_site_url || (inputs.target_slot == 'blue' && vars.AZURE_BLUE_URL || vars.AZURE_GREEN_URL) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.PUBLIC_SITE_URL }}
          NEXT_PUBLIC_ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          NEXT_PUBLIC_ENTRA_AUTHORITY: ${{ vars.ENTRA_AUTHORITY }}
          NEXT_PUBLIC_ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          NEXT_PUBLIC_ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
          NEXT_PUBLIC_ENTRA_REDIRECT_URI: ${{ env.PUBLIC_SITE_URL }}
          SITE_VERSION: ${{ github.sha }}

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(az acr login --name "${{ vars.AZURE_ACR_NAME }}" --expose-token --query accessToken --output tsv)"
          printf '%s' "$TOKEN" | docker login "${{ vars.AZURE_ACR_NAME }}.azurecr.io" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin

      - name: Build and push the immutable image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ vars.AZURE_ACR_NAME }}.azurecr.io/filosage:${GITHUB_SHA}"
          if [[ ! "$PUBLIC_SITE_URL" =~ ^https://[^/]+/?$ ]]; then
            echo "public_site_url must be an HTTPS origin without a path."
            exit 1
          fi
          docker build \
            --tag "$IMAGE" \
            --build-arg "NEXT_PUBLIC_SITE_URL=${PUBLIC_SITE_URL}" \
            --build-arg "NEXT_PUBLIC_ENTRA_CLIENT_ID=${{ vars.ENTRA_CLIENT_ID }}" \
            --build-arg "NEXT_PUBLIC_ENTRA_AUTHORITY=${{ vars.ENTRA_AUTHORITY }}" \
            --build-arg "NEXT_PUBLIC_ENTRA_TENANT_ID=${{ vars.ENTRA_TENANT_ID }}" \
            --build-arg "NEXT_PUBLIC_ENTRA_API_SCOPE=${{ vars.ENTRA_API_SCOPE }}" \
            --build-arg "NEXT_PUBLIC_ENTRA_REDIRECT_URI=${PUBLIC_SITE_URL}" \
            --build-arg "SITE_VERSION=${GITHUB_SHA}" \
            .
          docker push "$IMAGE"

      - name: Deploy the exact image to Azure Container Apps
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ vars.AZURE_ACR_NAME }}.azurecr.io/filosage:${GITHUB_SHA}"
          ACTIVE_WEIGHT="$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query "properties.configuration.ingress.traffic[?label=='${TARGET_SLOT}'].weight | [0]" \
            --output tsv)"
          if [[ "${ACTIVE_WEIGHT:-0}" != "0" ]]; then
            echo "Refusing to replace ${TARGET_SLOT}; it currently carries ${ACTIVE_WEIGHT}% traffic."
            exit 1
          fi
          az containerapp revision set-mode \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --mode multiple
          REVISION_SUFFIX="${TARGET_SLOT}-${GITHUB_SHA:0:8}-${GITHUB_RUN_ATTEMPT}"
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --image "$IMAGE" \
            --revision-suffix "$REVISION_SUFFIX" \
            --set-env-vars \
              "SITE_VERSION=${GITHUB_SHA}" \
              "NEXT_PUBLIC_SITE_URL=${PUBLIC_SITE_URL}" \
              "NEXT_PUBLIC_ENTRA_CLIENT_ID=${{ vars.ENTRA_CLIENT_ID }}" \
              "NEXT_PUBLIC_ENTRA_AUTHORITY=${{ vars.ENTRA_AUTHORITY }}" \
              "NEXT_PUBLIC_ENTRA_TENANT_ID=${{ vars.ENTRA_TENANT_ID }}" \
              "NEXT_PUBLIC_ENTRA_API_SCOPE=${{ vars.ENTRA_API_SCOPE }}" \
              "NEXT_PUBLIC_ENTRA_REDIRECT_URI=${PUBLIC_SITE_URL}" \
              "DEPLOYMENT_SLOT=${TARGET_SLOT}"
          REVISION="$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query properties.latestRevisionName \
            --output tsv)"
          az containerapp revision label add \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --label "$TARGET_SLOT" \
            --revision "$REVISION" \
            --yes

      - name: Verify the labeled QA candidate
        run: npm run check:production -- "${TARGET_URL}" "${GITHUB_SHA}" "${PUBLIC_SITE_URL}"
