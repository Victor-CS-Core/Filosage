name: Build and verify inactive BFF revision

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full candidate SHA; execute this workflow from that exact ref
        required: true
        type: string
      expected_auth_mode:
        description: Preserve the observed shared application authentication mode
        required: true
        type: choice
        options: [direct-google, migration-dual]
      quality_run_id:
        description: Successful exact-SHA engineering quality-gate run
        required: true
        type: string
      regression_run_id:
        description: Successful exact-SHA full-regression run
        required: true
        type: string
      featured_course_id:
        description: Exact approved public course ID, or none
        required: true
        default: none
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

# One lock covers staging, verification and promotion for the same application.
concurrency:
  group: azure-blue-green-${{ vars.AZURE_CONTAINER_APP_NAME }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: azure-staging
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_AUTH_MODE: ${{ inputs.expected_auth_mode }}
      PUBLIC_SITE_URL: https://filosage.com
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/blue-green-evidence
      QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
      REGRESSION_RUN_ID: ${{ inputs.regression_run_id }}
      FEATURED_COURSE_ID: ${{ inputs.featured_course_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Require exact engineering evidence and observed 100/0 routing
        run: node scripts/azure-blue-green.mjs preflight
      - name: Build the selected application image once
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-capabilities.mjs environment > "$RUNNER_TEMP/release-capabilities.env"
          BUILD_ARGS=(--build-arg "SITE_VERSION=$EXPECTED_SHA" --build-arg "NEXT_PUBLIC_SITE_URL=$PUBLIC_SITE_URL")
          while IFS= read -r value; do BUILD_ARGS+=(--build-arg "$value"); done < "$RUNNER_TEMP/release-capabilities.env"
          IMAGE_TAG="filosage:${EXPECTED_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az acr build --registry "$AZURE_ACR_NAME" --image "$IMAGE_TAG" --target runtime --file Dockerfile "${BUILD_ARGS[@]}" --no-logs --output none .
          DIGEST="$(az acr repository show --name "$AZURE_ACR_NAME" --image "$IMAGE_TAG" --query digest --output tsv)"
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then exit 1; fi
          echo "EXPECTED_IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - name: Deploy zero-public-traffic candidate and verify revision then inactive label
        run: node scripts/azure-blue-green.mjs stage
      - name: Retain immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/blue-green-evidence/*.json
          if-no-files-found: error
          retention-days: 30
