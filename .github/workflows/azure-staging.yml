name: Stage QA-approved image for production

on:
  workflow_dispatch:
    inputs:
      target_slot:
        description: Inactive production label to receive the QA-approved image
        required: true
        default: green
        type: choice
        options:
          - green
          - blue
      expected_sha:
        description: Full Git SHA already deployed and verified in isolated QA
        required: true
        type: string
      featured_course_id:
        description: Exact public landing-page course ID, or the explicit value none
        required: true
        default: none
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-staging
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    environment: azure-staging
    env:
      TARGET_SLOT: ${{ inputs.target_slot }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      FEATURED_COURSE_ID: ${{ inputs.featured_course_id }}
      TARGET_URL: ${{ inputs.target_slot == 'blue' && vars.AZURE_BLUE_URL || vars.AZURE_GREEN_URL }}
      QA_URL: ${{ vars.AZURE_QA_URL }}
      PUBLIC_SITE_URL: https://filosage.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify inactive production authentication state before staging
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER_STATE="$(az containerapp auth show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query '{google:identityProviders.google.enabled || `false`,filosage:identityProviders.customOpenIdConnectProviders.filosage.enabled || `false`}' \
            --output json)"
          {
            echo "### Production authentication provider state before staging"
            echo '```json'
            echo "$PROVIDER_STATE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$PROVIDER_STATE" \
            | node scripts/check-auth-provider-state.mjs false

      - name: Verify the exact SHA in isolated QA
        env:
          EXPECTED_AUTH_MODE: migration-dual
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "expected_sha must be a full 40-character Git SHA."
            exit 1
          fi
          if [[ "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "Run this workflow from the exact branch or commit selected in QA."
            exit 1
          fi
          if [[ "$FEATURED_COURSE_ID" != "none" && ! "$FEATURED_COURSE_ID" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "featured_course_id must be none or a 64-character hexadecimal course ID."
            exit 1
          fi
          npm run check:production -- "$QA_URL" "$EXPECTED_SHA" "$QA_URL"

      - name: Deploy the exact image to Azure Container Apps
        id: deploy_revision
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="$(az acr repository show \
            --name "${{ vars.AZURE_ACR_NAME }}" \
            --image "filosage:${EXPECTED_SHA}" \
            --query digest \
            --output tsv)"
          if [[ ! "$DIGEST" =~ ^sha256:[a-fA-F0-9]{64}$ ]]; then
            echo "The QA-approved image digest could not be resolved."
            exit 1
          fi
          IMAGE="${{ vars.AZURE_ACR_NAME }}.azurecr.io/filosage@${DIGEST}"
          REMOVE_ENV_VARS=(
            "NEXT_PUBLIC_ENTRA_CLIENT_ID"
            "NEXT_PUBLIC_ENTRA_AUTHORITY"
            "NEXT_PUBLIC_ENTRA_TENANT_ID"
            "NEXT_PUBLIC_ENTRA_API_SCOPE"
            "NEXT_PUBLIC_ENTRA_REDIRECT_URI"
            "ENTRA_AUDIENCE"
            "ENTRA_ISSUER"
            "ENTRA_JWKS_URI"
            "ENTRA_DIRECTORY_TENANT_ID"
            "ENTRA_DIRECTORY_CLIENT_ID"
            "ENTRA_DIRECTORY_CLIENT_SECRET"
            "FLASHCARD_DECKS_ENABLED"
            "FLASHCARD_AI_GENERATION_ENABLED"
          )
          SET_ENV_VARS=(
            "SITE_VERSION=${EXPECTED_SHA}"
            "NEXT_PUBLIC_SITE_URL=${PUBLIC_SITE_URL}"
            "DEPLOYMENT_ENVIRONMENT=production"
            "OPERATIONS_ENVIRONMENT=azure-staging"
            "AZURE_EASY_AUTH_ENABLED=true"
            "DIRECT_GOOGLE_AUTH_ENABLED=true"
            "EXTERNAL_ID_AUTH_ENABLED=false"
            "EXTERNAL_ID_NEW_ACCOUNTS_ENABLED=false"
            "BILLING_ENABLED=false"
            "DEPLOYMENT_SLOT=${TARGET_SLOT}"
          )
          if [[ "$FEATURED_COURSE_ID" == "none" ]]; then
            REMOVE_ENV_VARS+=("LANDING_FEATURED_COURSE_ID")
          else
            SET_ENV_VARS+=("LANDING_FEATURED_COURSE_ID=${FEATURED_COURSE_ID}")
          fi
          ACTIVE_WEIGHT="$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query "properties.configuration.ingress.traffic[?label=='${TARGET_SLOT}'].weight | [0]" \
            --output tsv)"
          if [[ "${ACTIVE_WEIGHT:-0}" != "0" ]]; then
            echo "Refusing to replace ${TARGET_SLOT}; it currently carries ${ACTIVE_WEIGHT}% traffic."
            exit 1
          fi
          az containerapp revision set-mode \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --mode multiple
          REVISION_SUFFIX="${TARGET_SLOT}-${EXPECTED_SHA:0:8}-${GITHUB_RUN_ATTEMPT}"
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --image "$IMAGE" \
            --revision-suffix "$REVISION_SUFFIX" \
            --remove-env-vars "${REMOVE_ENV_VARS[@]}" \
            --set-env-vars "${SET_ENV_VARS[@]}"
          REVISION="$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query properties.latestRevisionName \
            --output tsv)"
          REVISION_FQDN="$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query properties.latestRevisionFqdn \
            --output tsv)"
          if [[ -z "$REVISION" || ! "$REVISION_FQDN" =~ ^[a-z0-9.-]+\.azurecontainerapps\.io$ ]]; then
            echo "The deployed revision name or HTTPS hostname could not be resolved."
            exit 1
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "revision_url=https://${REVISION_FQDN}" >> "$GITHUB_OUTPUT"

      - name: Verify inactive production authentication state after staging
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER_STATE="$(az containerapp auth show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query '{google:identityProviders.google.enabled || `false`,filosage:identityProviders.customOpenIdConnectProviders.filosage.enabled || `false`}' \
            --output json)"
          {
            echo "### Production authentication provider state after staging"
            echo '```json'
            echo "$PROVIDER_STATE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$PROVIDER_STATE" \
            | node scripts/check-auth-provider-state.mjs false

      - name: Verify the deployed release safety policy
        env:
          EXPECTED_AUTH_MODE: direct-google
        shell: bash
        run: |
          set -euo pipefail
          npm run check:production -- "${{ steps.deploy_revision.outputs.revision_url }}" "$EXPECTED_SHA" "$PUBLIC_SITE_URL"
          npm run check:release-safety -- "${{ steps.deploy_revision.outputs.revision_url }}"
          npm run check:featured-course -- "${{ steps.deploy_revision.outputs.revision_url }}" "$FEATURED_COURSE_ID"

      - name: Assign verified revision label
        shell: bash
        run: |
          set -euo pipefail
          az containerapp revision label add \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --label "$TARGET_SLOT" \
            --revision "${{ steps.deploy_revision.outputs.revision }}" \
            --yes

      - name: Verify the labeled QA candidate
        env:
          EXPECTED_AUTH_MODE: direct-google
        shell: bash
        run: |
          set -euo pipefail
          npm run check:production -- "${TARGET_URL}" "${EXPECTED_SHA}" "${PUBLIC_SITE_URL}"
          npm run check:featured-course -- "${TARGET_URL}" "$FEATURED_COURSE_ID"
