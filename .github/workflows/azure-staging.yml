name: Deploy Azure staging

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-staging
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    environment: azure-staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.AZURE_STAGING_URL }}
          NEXT_PUBLIC_ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          NEXT_PUBLIC_ENTRA_AUTHORITY: ${{ vars.ENTRA_AUTHORITY }}
          NEXT_PUBLIC_ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
          NEXT_PUBLIC_ENTRA_REDIRECT_URI: ${{ vars.AZURE_STAGING_URL }}
          SITE_VERSION: ${{ github.sha }}

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build and push the immutable image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ vars.AZURE_ACR_NAME }}.azurecr.io/filosage:${GITHUB_SHA}"
          docker build \
            --tag "$IMAGE" \
            --build-arg "NEXT_PUBLIC_SITE_URL=${{ vars.AZURE_STAGING_URL }}" \
            --build-arg "NEXT_PUBLIC_ENTRA_CLIENT_ID=${{ vars.ENTRA_CLIENT_ID }}" \
            --build-arg "NEXT_PUBLIC_ENTRA_AUTHORITY=${{ vars.ENTRA_AUTHORITY }}" \
            --build-arg "NEXT_PUBLIC_ENTRA_API_SCOPE=${{ vars.ENTRA_API_SCOPE }}" \
            --build-arg "NEXT_PUBLIC_ENTRA_REDIRECT_URI=${{ vars.AZURE_STAGING_URL }}" \
            --build-arg "SITE_VERSION=${GITHUB_SHA}" \
            .
          docker push "$IMAGE"

      - name: Deploy the exact image to Azure Container Apps
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ vars.AZURE_ACR_NAME }}.azurecr.io/filosage:${GITHUB_SHA}"
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --image "$IMAGE" \
            --set-env-vars \
              "SITE_VERSION=${GITHUB_SHA}" \
              "NEXT_PUBLIC_SITE_URL=${{ vars.AZURE_STAGING_URL }}" \
              "NEXT_PUBLIC_ENTRA_CLIENT_ID=${{ vars.ENTRA_CLIENT_ID }}" \
              "NEXT_PUBLIC_ENTRA_AUTHORITY=${{ vars.ENTRA_AUTHORITY }}" \
              "NEXT_PUBLIC_ENTRA_API_SCOPE=${{ vars.ENTRA_API_SCOPE }}" \
              "NEXT_PUBLIC_ENTRA_REDIRECT_URI=${{ vars.AZURE_STAGING_URL }}"

      - name: Verify the deployed commit
        run: npm run check:production -- "${{ vars.AZURE_STAGING_URL }}" "${GITHUB_SHA}"
