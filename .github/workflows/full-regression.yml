name: Full browser regression

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:command-center:v2
      - run: npm run test:command-center:v2:ui
      - run: npm run test:shared-evidence:ui
      - run: npm run test:api && npm run test:browser
      - name: Upload full regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
