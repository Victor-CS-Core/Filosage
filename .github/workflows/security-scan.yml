name: Offline security scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep CE security gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify report privacy and failure policy
        run: node --test tests/security/semgrep-report.test.mjs
      - name: Verify detectors and scan the exact checkout without network access
        env:
          EXPECTED_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/run-security-scan.mjs
      - name: Retain sanitized security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-security-evidence
          path: test-results/security/summary.json
          if-no-files-found: error
          retention-days: 14
