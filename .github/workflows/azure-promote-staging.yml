name: Promote Azure staging slot

on:
  workflow_dispatch:
    inputs:
      target_slot:
        description: Verified slot to receive default staging traffic
        required: true
        type: choice
        options:
          - green
          - blue
      expected_sha:
        description: Exact 40-character SHA already verified on the target label
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-staging
  cancel-in-progress: false

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    environment: azure-staging
    env:
      TARGET_SLOT: ${{ inputs.target_slot }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      TARGET_URL: ${{ inputs.target_slot == 'blue' && vars.AZURE_BLUE_URL || vars.AZURE_GREEN_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify and promote the selected slot
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "expected_sha must be a full 40-character Git SHA."
            exit 1
          fi
          npm run check:production -- "$TARGET_URL" "$EXPECTED_SHA"
          OTHER_SLOT="blue"
          if [[ "$TARGET_SLOT" == "blue" ]]; then OTHER_SLOT="green"; fi
          az containerapp ingress traffic set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --label-weight "${TARGET_SLOT}=100" "${OTHER_SLOT}=0"
          npm run check:production -- "${{ vars.AZURE_STAGING_URL }}" "$EXPECTED_SHA"
