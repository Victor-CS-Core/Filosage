name: Promote verified BFF revision without rebuilding

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full candidate SHA; execute this workflow from that exact ref
        required: true
        type: string
      expected_auth_mode:
        description: Preserve the observed shared application authentication mode
        required: true
        type: choice
        options: [direct-google, migration-dual]
      candidate_run_id:
        description: Successful immutable inactive-candidate staging run
        required: true
        type: string
      verification_run_id:
        description: Successful exact-candidate evidence-verification run
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

# One lock covers staging, verification and promotion for the same application.
concurrency:
  group: azure-blue-green-${{ vars.AZURE_CONTAINER_APP_NAME }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Obtain Victor's explicit approval of this exact promotion in the task/handoff
    # before dispatch. This is procedural approval, not a native GitHub reviewer gate.
    environment: azure-staging
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_AUTH_MODE: ${{ inputs.expected_auth_mode }}
      PUBLIC_SITE_URL: https://filosage.com
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify maintenance access safety contracts
        run: node --test tests/maintenance-access/*.test.mjs
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare optional exact maintenance runner access
        run: node scripts/maintenance-runner-access.mjs prepare
      - name: Persist owned access intent before any ingress mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance-access-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maintenance-access-evidence/intent.json
          if-no-files-found: error
          retention-days: 30
      - name: Admit only this runner during an existing operator-only maintenance fence
        run: node scripts/maintenance-runner-access.mjs apply
      - name: Recheck exact candidate and reviewed evidence then swap 100/0 traffic
        id: promotion
        run: node scripts/azure-blue-green.mjs promote
      - name: Restore only the explicitly reviewed compatible predecessor on failure
        if: failure() || cancelled()
        run: node scripts/azure-blue-green.mjs rollback
      - name: Retain actual promotion and rollback readbacks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-${{ inputs.expected_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/blue-green-evidence/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove only this run's owned maintenance access rule
        if: always()
        run: node scripts/maintenance-runner-access.mjs cleanup
      - name: Retain access and cleanup evidence including uncertain outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance-access-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maintenance-access-evidence/*.json
          if-no-files-found: error
          retention-days: 30
