name: Promote Azure staging slot

on:
  workflow_dispatch:
    inputs:
      target_slot:
        description: Verified slot to receive default staging traffic
        required: true
        type: choice
        options:
          - green
          - blue
      expected_sha:
        description: Exact 40-character SHA already verified on the target label
        required: true
        type: string
      featured_course_id:
        description: Exact public landing-page course ID verified on the selected label, or none
        required: true
        default: none
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-staging
  cancel-in-progress: false

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    environment: azure-staging
    env:
      TARGET_SLOT: ${{ inputs.target_slot }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      FEATURED_COURSE_ID: ${{ inputs.featured_course_id }}
      TARGET_URL: ${{ inputs.target_slot == 'blue' && vars.AZURE_BLUE_URL || vars.AZURE_GREEN_URL }}
      EXPECTED_AUTH_MODE: direct-google
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify inactive production authentication state before promotion
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER_STATE="$(az containerapp auth show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query '{google:identityProviders.google.enabled || `false`,filosage:identityProviders.customOpenIdConnectProviders.filosage.enabled || `false`}' \
            --output json)"
          {
            echo "### Production authentication provider state before promotion"
            echo '```json'
            echo "$PROVIDER_STATE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$PROVIDER_STATE" \
            | node scripts/check-auth-provider-state.mjs false

      - name: Verify the selected slot
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "expected_sha must be a full 40-character Git SHA."
            exit 1
          fi
          if [[ "$FEATURED_COURSE_ID" != "none" && ! "$FEATURED_COURSE_ID" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "featured_course_id must be none or a 64-character hexadecimal course ID."
            exit 1
          fi
          npm run check:production -- "$TARGET_URL" "$EXPECTED_SHA"
          npm run check:featured-course -- "$TARGET_URL" "$FEATURED_COURSE_ID"

      - name: Verify the deployed release safety policy
        shell: bash
        run: |
          set -euo pipefail
          TARGET_REVISION="$(az containerapp show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --query "properties.configuration.ingress.traffic[?label=='${TARGET_SLOT}'].revisionName | [0]" --output tsv)"
          if [[ -z "$TARGET_REVISION" ]]; then
            echo "The selected label does not resolve to a revision."
            exit 1
          fi
          npm run check:release-safety -- "$TARGET_URL"

      - name: Capture current traffic weights
        id: capture_traffic
        shell: bash
        run: |
          set -euo pipefail
          TRAFFIC="$(az containerapp ingress traffic show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --output json)"
          export TRAFFIC
          node -e '
            const fs = require("node:fs");
            const traffic = JSON.parse(process.env.TRAFFIC || "[]");
            const blue = traffic.filter((entry) => entry.label === "blue");
            const green = traffic.filter((entry) => entry.label === "green");
            if (traffic.length !== 2 || blue.length !== 1 || green.length !== 1) {
              throw new Error("Traffic snapshot must contain only one blue and one green label.");
            }
            const blueWeight = blue[0].weight;
            const greenWeight = green[0].weight;
            if (!Number.isInteger(blueWeight) || !Number.isInteger(greenWeight) || blueWeight < 0 || greenWeight < 0 || blueWeight + greenWeight !== 100) {
              throw new Error("Blue and green traffic weights must be non-negative integers totaling 100.");
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `blue_weight=${blueWeight}\ngreen_weight=${greenWeight}\n`);
          '

      - name: Switch staging traffic
        id: traffic_switch
        shell: bash
        run: |
          set -euo pipefail
          OTHER_SLOT="blue"
          if [[ "$TARGET_SLOT" == "blue" ]]; then OTHER_SLOT="green"; fi
          az containerapp ingress traffic set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --label-weight "${TARGET_SLOT}=100" "${OTHER_SLOT}=0"

      - name: Verify promoted public traffic
        shell: bash
        run: |
          set -euo pipefail
          npm run check:production -- "${{ vars.AZURE_STAGING_URL }}" "$EXPECTED_SHA"
          npm run check:featured-course -- "${{ vars.AZURE_STAGING_URL }}" "$FEATURED_COURSE_ID"

      - name: Roll back traffic if promotion fails or is cancelled
        if: (failure() || cancelled()) && steps.capture_traffic.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          az containerapp ingress traffic set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --label-weight \
              "blue=${{ steps.capture_traffic.outputs.blue_weight }}" \
              "green=${{ steps.capture_traffic.outputs.green_weight }}"
