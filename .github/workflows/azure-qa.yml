name: Deploy isolated Azure QA

on:
  workflow_dispatch:
    inputs:
      external_id_auth_enabled:
        description: Open the application acceptance gate only after the filosage Easy Auth provider is separately approved, configured, and enabled
        required: true
        default: true
        type: boolean
      external_id_new_accounts_enabled:
        description: Permit QA-only new External ID accounts after registry preflight
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: azure-qa
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    environment: azure-staging
    env:
      QA_URL: ${{ vars.AZURE_QA_URL }}
      PUBLIC_SITE_URL: https://filosage.com
      EXPECTED_AUTH_MODE: ${{ inputs.external_id_auth_enabled && 'migration-dual' || 'direct-google' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate the reviewed capability selection
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-capabilities.mjs environment > "$RUNNER_TEMP/release-capabilities.env"

      - name: Verify the exact SHA passed the required quality gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/quality-gate.yml/runs" \
            -f "head_sha=${GITHUB_SHA}" \
            -f "status=success" \
            -f "per_page=1")"
          printf '%s' "$EVIDENCE" \
            | node scripts/check-workflow-run-evidence.mjs \
              "$GITHUB_SHA" \
              ".github/workflows/quality-gate.yml"

      - name: Validate identity activation inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.external_id_new_accounts_enabled }}" == "true" && "${{ inputs.external_id_auth_enabled }}" != "true" ]]; then
            echo "New External ID accounts require the QA External ID provider to be enabled."
            exit 1
          fi

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify separately configured QA authentication state before deployment
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER_STATE="$(az containerapp auth show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_QA_CONTAINER_APP_NAME }}" \
            --query '{google:identityProviders.google.enabled || `false`,filosage:identityProviders.customOpenIdConnectProviders.filosage.enabled || `false`}' \
            --output json)"
          {
            echo "### QA authentication provider state before deployment"
            echo '```json'
            echo "$PROVIDER_STATE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$PROVIDER_STATE" \
            | node scripts/check-auth-provider-state.mjs "$EXPECTED_AUTH_MODE"

      - name: Build and push the immutable QA-approved image
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(az acr login --name "${{ vars.AZURE_ACR_NAME }}" --expose-token --query accessToken --output tsv)"
          printf '%s' "$TOKEN" | docker login "${{ vars.AZURE_ACR_NAME }}.azurecr.io" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin
          IMAGE="${{ vars.AZURE_ACR_NAME }}.azurecr.io/filosage:${GITHUB_SHA}"
          mapfile -t CAPABILITY_ENV < "$RUNNER_TEMP/release-capabilities.env"
          BUILD_ARGS=()
          for value in "${CAPABILITY_ENV[@]}"; do BUILD_ARGS+=(--build-arg "$value"); done
          docker build \
            --tag "$IMAGE" \
            --build-arg "NEXT_PUBLIC_SITE_URL=${PUBLIC_SITE_URL}" \
            --build-arg "SITE_VERSION=${GITHUB_SHA}" \
            "${BUILD_ARGS[@]}" \
            .
          docker push "$IMAGE"
          DIGEST="$(az acr repository show --name "${{ vars.AZURE_ACR_NAME }}" --image "filosage:${GITHUB_SHA}" --query digest --output tsv)"
          node scripts/release-capabilities.mjs create-evidence "$GITHUB_SHA" "$DIGEST" "$PUBLIC_SITE_URL" "$QA_URL" "$EXPECTED_AUTH_MODE" > "$RUNNER_TEMP/release-candidate.json"
          node scripts/release-capabilities.mjs verify-evidence "$RUNNER_TEMP/release-candidate.json" "$GITHUB_SHA" "$PUBLIC_SITE_URL" >> "$GITHUB_ENV"

      - name: Deploy the exact image to isolated QA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$QA_URL" =~ ^https://[^/]+/?$ ]]; then
            echo "AZURE_QA_URL must be an HTTPS origin without a path."
            exit 1
          fi
          IMAGE="${{ vars.AZURE_ACR_NAME }}.azurecr.io/filosage@${EXPECTED_IMAGE_DIGEST}"
          mapfile -t CAPABILITY_ENV < "$RUNNER_TEMP/release-capabilities.env"
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_QA_CONTAINER_APP_NAME }}" \
            --image "$IMAGE" \
            --revision-suffix "qa-${GITHUB_SHA:0:8}-${GITHUB_RUN_ATTEMPT}" \
            --set-env-vars "${CAPABILITY_ENV[@]}" \
              "RELEASE_IMAGE_DIGEST=${EXPECTED_IMAGE_DIGEST}" \
              "SITE_VERSION=${GITHUB_SHA}" \
              "NEXT_PUBLIC_SITE_URL=${QA_URL}" \
              "DEPLOYMENT_ENVIRONMENT=qa" \
              "DEPLOYMENT_SLOT=qa" \
              "OPERATIONS_ENVIRONMENT=qa" \
              "AZURE_EASY_AUTH_ENABLED=true" \
              "DIRECT_GOOGLE_AUTH_ENABLED=true" \
              "EXTERNAL_ID_AUTH_ENABLED=${{ inputs.external_id_auth_enabled }}" \
              "EXTERNAL_ID_NEW_ACCOUNTS_ENABLED=${{ inputs.external_id_new_accounts_enabled }}" \
              "OWNER_EMAIL=ktr0nn@icloud.com" \
              "BILLING_ENABLED=false" \
              "BILLING_ROLLOUT_MODE=closed" \
              "STRIPE_TAX_READY=false"

      - name: Verify separately configured QA authentication state after deployment
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER_STATE="$(az containerapp auth show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_QA_CONTAINER_APP_NAME }}" \
            --query '{google:identityProviders.google.enabled || `false`,filosage:identityProviders.customOpenIdConnectProviders.filosage.enabled || `false`}' \
            --output json)"
          {
            echo "### QA authentication provider state after deployment"
            echo '```json'
            echo "$PROVIDER_STATE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$PROVIDER_STATE" \
            | node scripts/check-auth-provider-state.mjs "$EXPECTED_AUTH_MODE"

      - name: Verify isolated QA candidate
        shell: bash
        run: |
          set -euo pipefail
          OBSERVED_IMAGE="$(az containerapp show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_QA_CONTAINER_APP_NAME }}" --query 'properties.template.containers[0].image' --output tsv)"
          node scripts/release-capabilities.mjs check-image "${{ vars.AZURE_ACR_NAME }}.azurecr.io/filosage" "$EXPECTED_IMAGE_DIGEST" "$OBSERVED_IMAGE"
          npm run check:production -- "$QA_URL" "$GITHUB_SHA" "$QA_URL"
          npm run check:release-safety -- "$QA_URL"

      - name: Retain exact QA candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate.json
          if-no-files-found: error
          retention-days: 90
