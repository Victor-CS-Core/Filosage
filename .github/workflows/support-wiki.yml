name: Support wiki

on:
  pull_request:
  schedule:
    - cron: "0 14 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate support wiki integrity and change impact
        if: github.event_name == 'pull_request'
        env:
          SUPPORT_WIKI_PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run check:support-wiki -- --base "${{ github.event.pull_request.base.sha }}"
      - name: Validate support wiki freshness
        if: github.event_name != 'pull_request'
        run: npm run check:support-wiki -- --stale-after 180
